registry_version: 1.0.0
schema_version: report-rule-registry/v1
authority: rules/registry.yaml
description: Single authoritative catalog for semantic, package, disclosure, security, and accessibility
  rules. Schemas establish structure; this registry establishes meaning. Domain overlays may activate rules
  and bind parameters, but may not redefine a rule condition, message, remediation, or waiver policy.
expression_language:
  id: report-rule-expression/v1
  description: Declarative predicates over the normalized report graph. `exists`, `all`, `any`, `count`,
    `references`, `reachable`, `changed`, `matches`, and `bundle_contains` are validator primitives. Paths are
    RFC 6901 JSON Pointer templates; `*` denotes iteration over array members.
severity_order:
  - information
  - warning
  - error
  - blocker
waiver_contract:
  required_fields:
    - waiver_id
    - rule_id
    - scope_pointer
    - rationale
    - approver
    - approved_at
    - expires_at
    - source_bindings
  behavior: A waiver records accepted residual risk; it does not make a failed predicate pass, erase the
    finding, or authorize a stronger scientific claim. Waivers cannot reveal withheld content.
epistemic_input_policy:
  unknown: Never coerce to absent, false, zero, not_applicable, or pass. If a predicate cannot be decided, emit
    unknown/not_evaluated unless the rule specifically detects an unsupported unknown-dependent claim.
  not_applicable: Accept only when a named applicability rule and traceable decision establish it. Do not infer
    it from an empty collection.
  withheld: Evaluate only non-revealing state and authorized metadata. Never request, log, hash into a public
    artifact, or reconstruct the protected value. Inability to evaluate protected content is
    unknown/not_evaluated, not pass.
  known: Require the canonical source-or-derivation provenance envelope before treating a value as known.
  sentinel_strings: Empty strings and placeholders such as TBD or N/A never substitute for an epistemic state.
  waiver: A waiver never converts unknown or not_evaluated into pass and never authorizes disclosure of withheld
    content.
rules:
  - id: COV001
    title: Authoritative source item left undisposed
    scope:
      artifacts:
        - scientific_report
      domains:
        - core
      phases:
        - coverage
    severity: blocker
    condition: source_coverage.authoritative_universe.state == "known" and any source_coverage.registered_items
      item has no disposition in {included, excluded_with_reason, unreadable, inaccessible, duplicate,
      unmapped}, or an excluded/duplicate item lacks its reason or target.
    pointer_hint: /source_coverage/registered_items/*/disposition
    message: An item in the authoritative source universe has not been explicitly disposed.
    remediation: Inventory the item and record one allowed disposition with a source-bound reason; include or map
      it where possible. Do not delete the item merely to make the denominator smaller.
    waiver_policy:
      allowed: false
      rationale: Coverage of a declared authoritative universe is a publication boundary.
  - id: COV002
    title: Absolute completeness language without an authoritative universe
    scope:
      artifacts:
        - scientific_report
        - rendered_bundle
      domains:
        - core
      phases:
        - coverage
        - rendering
    severity: blocker
    condition: source_coverage.authoritative_universe.state != "known" and any public narrative or coverage label
      asserts absolute or exhaustive completeness rather than registered-source completeness with an explicit
      limitation.
    pointer_hint: /source_coverage/completeness_statement
    message: Absolute completeness is claimed although overall completeness cannot be proved.
    remediation: Replace absolute wording with a bounded statement about registered sources, expose the missing
      authoritative universe, and set overall completeness to not_evaluable or the equivalent explicit unknown
      state.
    waiver_policy:
      allowed: false
      rationale: A waiver cannot turn an unknown source universe into a known denominator.
  - id: WRK001
    title: Unsupported completed work unit
    scope:
      artifacts:
        - scientific_report
      domains:
        - core
      phases:
        - work_execution
    severity: blocker
    condition: any work_unit or attempt has status == "completed" while its completion criterion is missing,
      unknown, or not satisfied by cited execution and output evidence from the represented execution scope.
    pointer_hint: /work_units/*/status
    message: Work is marked completed without a completion criterion and evidence that it was met.
    remediation: Supply the predeclared or source-supported completion criterion and bind execution/output
      evidence, or downgrade status to attempted or unknown.
    waiver_policy:
      allowed: false
      rationale: Completed is an evidence-bearing state, not a reviewer preference.
  - id: WRK002
    title: External work counted as project execution
    scope:
      artifacts:
        - scientific_report
        - rendered_bundle
      domains:
        - core
      phases:
        - work_execution
        - rendering
    severity: blocker
    condition: a completion or attempt count labeled as this project includes work whose execution_scope is
      external_study or upstream_collaborator, or includes reanalysis as new experimental execution without a
      separate count.
    pointer_hint: /work_units/*/execution_scope
    message: Work performed outside this project is included in this project's completed-work count.
    remediation: Separate this_project, reanalysis, external_study, upstream_collaborator, and synthetic scopes in
      both facts and displayed denominators.
    waiver_policy:
      allowed: false
      rationale: Execution ownership must remain explicit.
  - id: WRK003
    title: Retry overwrote prior failed history
    scope:
      artifacts:
        - scientific_report
      domains:
        - core
      phases:
        - work_execution
    severity: blocker
    condition: a later successful attempt follows a failed/aborted attempt or a partially_succeeded/cancelled attempt
      carrying a material FailureEvent, but no supersession/recovery chain or source-bound typed not_a_retry
      relation distinguishes their history.
    pointer_hint: /work_units/*/attempts
    message: A successful later attempt does not preserve or classify the preceding material failure relationship.
    remediation: Restore immutable predecessor attempts and segments, link retries through supersession or recovery,
      retain failure events and partial-output dispositions, or add a typed source-bound not_a_retry relation for a
      genuinely independent later attempt.
    waiver_policy:
      allowed: false
      rationale: Historical execution records are append-only.
  - id: TIM001
    title: Unsupported prospective timing classification
    scope:
      artifacts:
        - scientific_report
      domains:
        - core
      phases:
        - decision_timing
    severity: blocker
    condition: any criterion, exclusion, threshold, endpoint, analysis plan, or decision is labeled
      predefined/prospective while no trustworthy timestamped source demonstrates it existed before outcome or
      test-data access.
    pointer_hint: /decision_events/*/timing_classification
    message: A decision is labeled prospective without evidence that it preceded outcome access.
    remediation: Bind a trustworthy pre-outcome record and access timeline, or classify the decision as adaptive,
      post_hoc, missing, or unknown as supported.
    waiver_policy:
      allowed: false
      rationale: Prospective status is a historical fact.
  - id: MAT001
    title: Material flow or analysis population does not close
    scope:
      artifacts:
        - scientific_report
      domains:
        - core
        - wet_lab
        - ai_ml
        - molecular_dynamics
      phases:
        - lineage
    severity: error
    condition: any material/sample/dataset/system input cannot be followed through transformations, pools/splits,
      inclusions, exclusions, losses, and outputs, or reported analysis counts disagree with the reachable
      lineage without an explicit unresolved discrepancy.
    pointer_hint: /material_lineage
    message: Material lineage or the analysis-population ledger has an unexplained gap or count mismatch.
    remediation: Add source-bound lineage edges, pool/split membership, dropout and exclusion records, and
      reconcile counts; otherwise mark the population unknown and qualify dependent results.
    waiver_policy:
      allowed: true
      maximum_severity_after_waiver: warning
      requirements:
        - named_approver
        - bounded_scope
        - unresolved_gap_disclosed
        - dependent_claims_qualified
        - expiry
  - id: DER001
    title: Quantitative claim lacks derivation closure
    scope:
      artifacts:
        - scientific_report
      domains:
        - core
        - wet_lab
        - ai_ml
        - molecular_dynamics
      phases:
        - derivation
    severity: error
    condition: a quantitative non-background claim or displayed value is not reachable through DataSlice ->
      DerivationRecord -> AnalysisRun -> OutputArtifact -> EvidenceItem, including input version/hash,
      selector/filter, code or invocation, environment, exit state, and output identity as applicable.
    pointer_hint: /claims/*/evidence_item_ids
    message: A quantitative claim cannot be traced through a closed derivation chain.
    remediation: Register the exact data slice, derivation, actual analysis run, output artifact, and evidence
      link. If unavailable, preserve unknown provenance and weaken or remove the quantitative claim.
    waiver_policy:
      allowed: true
      maximum_severity_after_waiver: warning
      requirements:
        - named_approver
        - affected_values_listed
        - provenance_gap_disclosed
        - no_reproducibility_upgrade
        - expiry
  - id: CLM001
    title: Non-background claim lacks support
    scope:
      artifacts:
        - scientific_report
      domains:
        - core
      phases:
        - argument_graph
    severity: blocker
    condition: any claim whose role is not background has neither admissible direct evidence nor a valid argument
      step whose premises are supported; causal and mechanistic claims additionally require an admissible
      concluding step with known nonempty rationale, assumptions, and alternative explanations and cannot rely
      on association alone.
    pointer_hint: /claims/*
    message: A report claim has no valid evidence or supported premises.
    remediation: Link admissible evidence or supported premises, register qualifications and counterevidence, or
      recast the statement as a question, hypothesis, limitation, or unknown.
    waiver_policy:
      allowed: false
      rationale: Unsupported statements cannot remain scientific claims.
  - id: BRG001
    title: Cross-domain mechanism claim lacks a valid bridge
    scope:
      artifacts:
        - scientific_report
      domains:
        - core
        - cross_domain
      phases:
        - argument_graph
    severity: blocker
    condition: a claim's direct evidence or cycle-safe full premise closure spans domains without a CrossDomainBridge
      that connects those domains, enables the exact cross-domain ArgumentStep, and aligns entity/construct,
      condition, intervention/dose, endpoint, state, and time/scale context.
    pointer_hint: /cross_domain_bridges/*
    message: A cross-domain mechanism claim jumps between incompatible or unaligned evidence contexts.
    remediation: Add and validate a bridge with source-bound mappings and mismatch impact; otherwise limit the
      claim to association or separate domain-specific observations.
    waiver_policy:
      allowed: false
      rationale: A waiver cannot supply missing scientific compatibility.
  - id: DEP001
    title: Dependent evidence counted as independent
    scope:
      artifacts:
        - scientific_report
        - rendered_bundle
      domains:
        - core
        - wet_lab
        - ai_ml
        - molecular_dynamics
      phases:
        - argument_graph
        - rendering
    severity: blocker
    condition: evidence units sharing an AnalysisPopulation, biological group/donor/material ancestry, data slice,
      trajectory, checkpoint, initialization, analysis output, or other transitive dependency are placed in
      separate groups marked independent or worded as independent support.
    pointer_hint: /claim_dependencies
    message: Dependent evidence is represented as independent corroboration.
    remediation: Register dependency edges and clusters, recompute independent-unit counts, and revise
      corroboration language and uncertainty.
    waiver_policy:
      allowed: false
      rationale: The protocol defines this invariant as a non-waivable release blocker.
  - id: CNF001
    title: Conflict omitted or heterogeneity collapsed
    scope:
      artifacts:
        - scientific_report
      domains:
        - core
        - wet_lab
        - ai_ml
        - molecular_dynamics
      phases:
        - conflict
    severity: blocker
    condition: incompatible values for the same entity, context, estimand, and version are not registered as a
      true conflict, or retained_as_heterogeneity lacks a typed, known, source-bound material context difference
      for every incompatible result pair.
    pointer_hint: /conflict_sets
    message: A true conflict is unregistered, or contextual heterogeneity has been flattened.
    remediation: Preserve all source values, compare identity/context/estimand, create a ConflictSet only for
      like-for-like incompatibility, and otherwise model heterogeneous conditions explicitly.
    waiver_policy:
      allowed: false
      rationale: The protocol defines this invariant as a non-waivable release blocker.
  - id: NUL001
    title: Negative result overinterpreted
    scope:
      artifacts:
        - scientific_report
        - rendered_bundle
      domains:
        - core
        - wet_lab
      phases:
        - results
        - argument_graph
    severity: blocker
    condition: a no-signal, no-detectable-effect, do-not-reject, or excluded result is used as biological
      counterevidence, equivalence, or absence when every declared control/QC/context/population identifier does
      not resolve to an applicable typed record, concrete checks fail, sensitivity is inadequate, or required
      interval, detection limit, MDE, or equivalence-bound evidence is absent.
    pointer_hint: /results/*/scientific_effect_class
    message: A negative or null result is stronger than the assay controls and sensitivity support.
    remediation: Report the orthogonal result axes without converting nonsignificance to absence. Supply valid
      controls, sensitivity and interval evidence, or mark the result inconclusive/not interpretable and
      weaken dependent claims.
    waiver_policy:
      allowed: false
      rationale: Interpretive strength cannot exceed assay capability.
  - id: NEG001
    title: Failure, negative, or excluded record missing from the ledger
    scope:
      artifacts:
        - scientific_report
        - rendered_bundle
      domains:
        - core
        - wet_lab
        - ai_ml
        - molecular_dynamics
      phases:
        - coverage
        - results
        - rendering
    severity: blocker
    condition: an included source has no complete byte-range and parser/pattern-set-bound extraction attestation, or
      that attestation identifies an attempted failure, no-effect/null result, adverse QC event, exclusion,
      cancelled/failed trial, crashed segment, retraction, or superseded output that is absent from the normalized
      ledger or hidden from full archive, no-script view, print, or search.
    pointer_hint: /failures
    message: A registered adverse, negative, failed, or excluded record has been omitted.
    remediation: Add the atomic record with source locator, link its attempt/result and disposition, and ensure
      deterministic rendering/search includes it even when filters are active.
    waiver_policy:
      allowed: false
      rationale: The protocol defines this invariant as a non-waivable release blocker.
  - id: REV001
    title: Revision or retraction did not propagate
    scope:
      artifacts:
        - scientific_report
      domains:
        - core
      phases:
        - revision
    severity: blocker
    condition: a source, data slice, artifact, result, or claim is corrected, superseded, withdrawn, or retracted
      but reachable downstream evidence/claims retain a valid state without a documented revalidation, impact
      assessment, or review_required transition.
    pointer_hint: /revision_events/*/affected_ids
    message: An upstream revision has not invalidated or revalidated all dependent claims.
    remediation: Traverse dependency edges, mark downstream objects invalidated or review_required, record the
      impact assessment, and revalidate before restoring any claim.
    waiver_policy:
      allowed: false
      rationale: Stale validity is not an acceptable residual-risk state.
  - id: REP001
    title: Reproducibility level exceeds available evidence
    scope:
      artifacts:
        - scientific_report
        - rendered_bundle
      domains:
        - core
        - wet_lab
        - ai_ml
        - molecular_dynamics
      phases:
        - reproducibility
    severity: blocker
    condition: a reproducibility unit's stated level exceeds the conservative minimum of source/derivation
      closure, actual-invocation versus recipe agreement, input/output access, environment capture,
      random-state capture, rerun verification, independence, and claim/output coverage; or unknown and
      withheld access are treated as available.
    pointer_hint: /reproducibility_units/*/level
    message: A reproducibility claim is stronger than one or more required axes support.
    remediation: Lower the level to the weakest supported axis, expose per-axis states and denominator, reconcile
      recipe differences, or add a hash-bound rerun and access evidence. Never infer a passing rerun from a
      recipe alone.
    waiver_policy:
      allowed: false
      rationale: A reproducibility grade is a derived evidence statement.
  - id: ATT001
    title: Validation attestation is not bound to the payload
    scope:
      artifacts:
        - validation_attestation
        - package_manifest
        - rendered_bundle
      domains:
        - core
      phases:
        - package_identity
    severity: blocker
    condition: the attestation's canonical scientific-payload digest, schema/rule registry versions, disclosure
      projection identity, or manifest identity differs from the packaged artifacts, or the attestation
      predates a scientific payload change.
    pointer_hint: /scientific_payload_digest
    message: The validation attestation does not identify the packaged scientific payload.
    remediation: Canonicalize and hash the final public payload, validate it against the declared schema and
      registry, generate a new attestation, and update the manifest. Do not copy forward a previous pass
      state.
    waiver_policy:
      allowed: false
      rationale: An unbound attestation provides no validation assurance.
  - id: RED001
    title: Restricted or local-only value leaked into the public bundle
    scope:
      artifacts:
        - public_scientific_report
        - package_manifest
        - rendered_bundle
      domains:
        - core
      phases:
        - disclosure
        - packaging
    severity: blocker
    condition: the public bundle, including JSON, HTML, SVG, index, metadata, URL, path, log, archive entry, or
      filename, contains a secret, a withheld original value, a restricted locator, a credential/token
      pattern, or an absolute local path.
    pointer_hint: /disclosure_state
    message: Public output contains content that must be withheld or kept local.
    remediation: Rebuild from the disclosure projection, replace values with explicit withheld envelopes and
      non-revealing reasons, sanitize paths/names and indexes, rotate exposed credentials, then scan every
      archive member again.
    waiver_policy:
      allowed: false
      rationale: Disclosure controls cannot be waived in a public artifact.
  - id: SEC001
    title: Unsafe active content, URL, or archive path
    scope:
      artifacts:
        - package_manifest
        - rendered_bundle
      domains:
        - core
      phases:
        - security
        - packaging
    severity: blocker
    condition: A bundled path is absolute or escapes its root; an archive entry traverses, aliases, or overwrites
      another entry; a rendered field becomes executable markup, script, style, or a dangerous URL; or the
      offline bundle loads undeclared remote content.
    pointer_hint: /files/*/path
    message: The package contains an unsafe path, active content, dangerous URL, or undeclared remote dependency.
    remediation: Reject traversal and ambiguous archive entries, normalize and confine relative paths,
      context-escape untrusted text, allowlist inert URL schemes, remove remote dependencies and active
      payloads, and rebuild the manifest.
    waiver_policy:
      allowed: false
      rationale: The offline report must remain inert and confined to its package root.
  - id: A11Y001
    title: Core reading task is not accessible
    scope:
      artifacts:
        - rendered_bundle
      domains:
        - core
      phases:
        - accessibility
        - rendering
    severity: error
    condition: a core task (overview, status distinction, claim-to-evidence navigation, failure/negative-result
      discovery, methods, provenance, or reproduction) cannot be completed with keyboard alone or in
      linear/no-script content, or meaning depends only on color, motion, hover, pointer gesture, or a chart
      without an equivalent table/text representation.
    pointer_hint: /render_validation/accessibility/core_tasks/*
    message: At least one core scientific reading task is unavailable to keyboard or linear-view users.
    remediation: Restore semantic headings/landmarks, visible focus and skip navigation, native controls, textual
      state labels, linear DOM order, no-script content, table/text alternatives, reduced motion,
      forced-colors support, and 400% reflow without loss.
    waiver_policy:
      allowed: true
      maximum_severity_after_waiver: warning
      requirements:
        - specific_task_named
        - accessible_alternative_provided
        - named_approver
        - remediation_deadline
        - expiry
  - id: WET001
    title: Replicate denominator or biological independence is inflated
    scope:
      artifacts:
        - scientific_report
      domains:
        - wet_lab
      phases:
        - domain_semantics
    severity: blocker
    condition: a ReplicateDesign does not declare an exact typed specimen_ids denominator for its work unit, or
      biological/technical N disagrees with those members and their resolved donor/pool ancestry.
    pointer_hint: /extensions/domain_payloads/*/replicate_designs/*/biological_n
    message: A wet-lab design's explicit member denominator, biological N, technical N, and lineage do not reconcile.
    remediation: Declare exact design-scoped specimen_ids, register pool/donor lineage and technical nesting,
      recompute N and uncertainty, and reassess dependent claims.
    waiver_policy:
      allowed: false
      rationale: Independence and biological N are properties of design, not row count.
  - id: WET002
    title: Required wet-lab identity or quality state absent
    scope:
      artifacts:
        - scientific_report
      domains:
        - wet_lab
      phases:
        - domain_semantics
    severity: error
    condition: a material or specimen critical to a result omits applicable identity and QC envelopes such as
      organism/donor/cell line, catalog/lot/RRID, passage, authentication, mycoplasma, construct
      sequence/version/hash, or equipment calibration without explicit unknown/not_applicable/withheld state.
    pointer_hint: /extensions/domain_payloads/*/material_records/*
    message: A critical wet-lab material lacks an explicit identity or quality-control state.
    remediation: Record source-bound values or explicit missingness envelopes, state impact on identity and
      interpretation, and qualify affected results.
    waiver_policy:
      allowed: true
      maximum_severity_after_waiver: warning
      requirements:
        - affected_materials_listed
        - identity_risk_disclosed
        - dependent_claims_qualified
        - named_approver
  - id: WET003
    title: Allocation, blinding, or dropout ledger incomplete
    scope:
      artifacts:
        - scientific_report
      domains:
        - wet_lab
      phases:
        - domain_semantics
    severity: error
    condition: an applicable experiment lacks explicit source-bound or missing states for randomization, batch
      balance, blinding/unblinding, dropout, contamination, or analysis exclusion, or those states disagree
      with material lineage.
    pointer_hint: /extensions/domain_payloads/*/replicate_designs/*/randomization
    message: Wet-lab allocation, blinding, contamination, or dropout is not fully reconciled.
    remediation: Add the allocation and QC events, timing, affected specimen IDs, exclusions and lineage edges;
      otherwise expose unknown risk and qualify analysis.
    waiver_policy:
      allowed: true
      maximum_severity_after_waiver: warning
      requirements:
        - missing_process_named
        - bias_risk_disclosed
        - affected_results_listed
        - named_approver
  - id: WET004
    title: Protocol deviation or failed control is detached from results
    scope:
      artifacts:
        - scientific_report
      domains:
        - wet_lab
      phases:
        - domain_semantics
    severity: error
    condition: a protocol deviation, contamination event, calibration failure, or failed control is not linked to
      the affected attempt/specimens/results and does not have an impact assessment and disposition.
    pointer_hint: /extensions/domain_payloads/*/qc_events/*/affected_ids
    message: A wet-lab quality event is not propagated to affected scientific records.
    remediation: Link affected IDs, add source-bound impact and disposition, update result interpretability and
      claims, and preserve the event in failure/search views.
    waiver_policy:
      allowed: true
      maximum_severity_after_waiver: warning
      requirements:
        - affected_scope_bounded
        - impact_disclosed
        - claims_qualified
        - named_approver
  - id: AIM001
    title: Group leakage across model-development partitions
    scope:
      artifacts:
        - scientific_report
      domains:
        - ai_ml
      phases:
        - domain_semantics
    severity: blocker
    condition: rows sharing an applicable independent group (donor, patient, specimen, sequence/homology cluster,
      structure template, batch, time-linked unit, or other declared group key) occur across training and
      validation/test partitions without a justified leakage-safe design and explicit assessment.
    pointer_hint: /extensions/domain_payloads/*/split_records/*/group_key
    message: Related observations cross data partitions and can leak information into evaluation.
    remediation: Rebuild the split by the independent group, freeze and hash its manifest, retrain/evaluate,
      register the leakage assessment, and invalidate affected results.
    waiver_policy:
      allowed: false
      rationale: A contaminated held-out estimate cannot be repaired by disclosure alone.
  - id: AIM002
    title: Correlated trajectory frames split across partitions
    scope:
      artifacts:
        - scientific_report
      domains:
        - ai_ml
        - molecular_dynamics
      phases:
        - domain_semantics
    severity: blocker
    condition: adjacent or correlated frames from the same trajectory/replica/continuous simulation segment are
      randomly distributed across training and validation/test partitions, or trajectory identity is
      unavailable when frame-derived rows are split.
    pointer_hint: /extensions/domain_payloads/*/split_records/*/trajectory_boundary
    message: Correlated frames from one trajectory are used on both sides of an evaluation boundary.
    remediation: Group by trajectory, replica, or an independence-justified block; rebuild and hash splits;
      retrain and invalidate contaminated evaluations.
    waiver_policy:
      allowed: false
      rationale: Random frame splitting does not create independent held-out evidence.
  - id: AIM003
    title: Stateful preprocessing fit outside training data
    scope:
      artifacts:
        - scientific_report
      domains:
        - ai_ml
      phases:
        - domain_semantics
    severity: blocker
    condition: a stateful normalization, imputation, feature selection, vocabulary, representation, calibration,
      or similar preprocessing step is fit using validation/test rows, or its fit partition, selector, code,
      and fitted artifact hash are not sufficient to establish train-only fitting.
    pointer_hint: /extensions/domain_payloads/*/preprocessing_records/*/fit_partition
    message: Stateful preprocessing is contaminated by held-out data or its fit scope is unprovable.
    remediation: Fit only on training data inside each split/fold, persist and hash fitted state, apply it without
      refitting, retrain/evaluate, and invalidate affected results.
    waiver_policy:
      allowed: false
      rationale: Held-out information in fitted preprocessing invalidates evaluation independence.
  - id: AIM004
    title: Trial search or selection history incomplete
    scope:
      artifacts:
        - scientific_report
      domains:
        - ai_ml
      phases:
        - domain_semantics
    severity: error
    condition: a reported selected-role model does not exactly derive from selected completed trials, or lacks a
      typed source-bound direct, ensemble, or post-search selection derivation whose inputs and outputs reconcile
      with the full search/trial/model ledger.
    pointer_hint: /extensions/domain_payloads/*/search_records/*
    message: The model-selection result cannot be reconciled with the complete trial history.
    remediation: Register search budget/space/rule, every attempted trial and failure, and a typed
      selection_derivation tying selected_trial_ids and their models to exactly the selected-role output models;
      use an explicit source-bound ensemble/post-search rule when outputs are not direct trial models.
    waiver_policy:
      allowed: true
      maximum_severity_after_waiver: warning
      requirements:
        - missing_trials_bounded
        - selection_bias_disclosed
        - test_claims_qualified
        - named_approver
  - id: AIM005
    title: Test access is inconsistent with model selection claims
    scope:
      artifacts:
        - scientific_report
      domains:
        - ai_ml
      phases:
        - domain_semantics
    severity: blocker
    condition: test results, rows, labels, or feedback were accessed before a claimed frozen selection/threshold
      decision, an access event is missing from the timeline, or test feedback influenced tuning while the
      result remains labeled untouched or confirmatory.
    pointer_hint: /extensions/domain_payloads/*/test_access_events
